<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>图像记忆库</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e5e7eb; --text:#1f2328;
    --muted:#6b7280; --accent:#2563eb; --accent-soft:#eff6ff;
    --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 20px 48px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:19px;margin:0;font-weight:600}
  .badge{padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:#fff}
  .badge.ready{color:var(--ok);border-color:#bbf7d0;background:#f0fdf4}
  .badge.busy{color:var(--warn);border-color:#fde68a;background:#fffbeb}
  .badge.bad{color:var(--bad);border-color:#fecaca;background:#fef2f2}
  .spacer{flex:1}
  .stats{color:var(--muted);font-size:12.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=text]{flex:1;min-width:180px;padding:8px 11px;border:1px solid var(--line);
        border-radius:8px;background:#fff;color:var(--text);font:inherit;outline:none}
  input[type=text]:focus{border-color:#bfdbfe;box-shadow:0 0 0 3px var(--accent-soft)}
  button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;
         color:var(--text);font:inherit;cursor:pointer;transition:.15s}
  button:hover{border-color:#cbd5e1;background:#f8fafc}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#1d4ed8}
  button.ghost{padding:5px 10px;font-size:12.5px}
  button:disabled{opacity:.55;cursor:not-allowed}
  .file{display:inline-flex;align-items:center;gap:8px}
  .hint{color:var(--muted);font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .tile{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;
        display:flex;flex-direction:column}
  .tile .shot{aspect-ratio:4/3;background:#f1f5f9;display:block;width:100%;object-fit:cover}
  .tile .body{padding:9px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
  .cap{font-size:13px;line-height:1.4;min-height:2.6em}
  .tags{color:var(--muted);font-size:12px}
  .meta{color:#9ca3af;font-size:11.5px}
  .tile .ops{display:flex;gap:6px;margin-top:auto;padding-top:4px}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;
         color:var(--muted);font-size:13px;background:#fcfcfd}
  select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;
         color:var(--text);font:inherit}
  .loglist{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto}
  .logrow{display:grid;grid-template-columns:62px 50px 1fr auto;gap:8px;align-items:baseline;
          padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fcfcfd}
  .logrow time{color:#9ca3af;font-size:12px;font-variant-numeric:tabular-nums}
  .lvl{padding:1px 0;border-radius:6px;font-size:10.5px;text-align:center;letter-spacing:.03em}
  .lvl.info{background:#eff6ff;color:#1d4ed8}
  .lvl.warn{background:#fffbeb;color:#b45309}
  .lvl.error{background:#fef2f2;color:#b91c1c}
  .logmsg{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logmeta{color:#9ca3af;font-size:11.5px;white-space:nowrap}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
         background:#111827;color:#f9fafb;padding:9px 15px;border-radius:9px;font-size:13px;
         opacity:0;pointer-events:none;transition:.2s;max-width:80vw}
  #toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
  #toast.err{background:#7f1d1d}
  footer{color:#9ca3af;font-size:12px;margin-top:22px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>图像记忆库</h1>
    <span id="state" class="badge">加载中</span>
    <span class="spacer"></span>
    <span id="stats" class="stats"></span>
  </header>

  <section class="card">
    <h2>收录一张图</h2>
    <div class="row">
      <span class="file">
        <input id="file" type="file" accept="image/*" />
      </span>
      <button id="upload" class="primary" disabled>收录所选图片</button>
      <span id="uplHint" class="hint">支持 jpg / png / webp；会走完整闸门与判定，重复图自动跳过。</span>
    </div>
  </section>

  <section class="card">
    <h2>检索</h2>
    <div class="row">
      <input id="query" type="text" placeholder="试试：狗 / 狮子 / 甜点 / 表情包（留空看最近）" />
      <button id="search" class="primary">搜索</button>
      <button id="reset" class="ghost">清空</button>
      <label class="hint" style="display:inline-flex;align-items:center;gap:6px">
        存档：<select id="personaSel"></select>
      </label>
    </div>
  </section>

  <section class="card">
    <h2 id="listTitle">最近收录</h2>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden></div>
  </section>

  <section class="card">
    <h2>判断层 <span id="judgeMeta" class="hint"></span></h2>
    <div class="row">
      <select id="judgeMode">
        <option value="model">模型</option>
        <option value="host">宿主槽位</option>
        <option value="heuristic">启发式</option>
      </select>
      <button id="judgeSave" class="ghost">保存</button>
      <span class="hint">识图固定走 Sensenova → CLIP 兜底；判断失败自动降级启发式。</span>
    </div>
  </section>

  <section class="card">
    <h2>运行日志 <span id="logMeta" class="hint"></span></h2>
    <div class="row" style="margin-bottom:9px">
      <select id="logLevel">
        <option value="">全部级别</option>
        <option value="warn">警告</option>
        <option value="error">错误</option>
      </select>
      <button id="logRefresh" class="ghost">刷新</button>
      <span class="hint">只保留最近 500 条；原始文件在 &lt;N.E.K.O&gt;\logs\plugin\N.E.K.O_Plugin_neko_image_embed_*.log</span>
    </div>
    <div id="logList" class="loglist"></div>
  </section>

  <footer>neko_image_embed · 判定链 gateway → laya → zeroshot → rules</footer>
</div>
<div id="toast"></div>

<script type="module">
const PLUGIN_ID = "neko_image_embed";
const TERMINAL = ["succeeded", "failed", "cancelled"];

let csrfPromise = null;
async function mutationHeaders() {
  if (!csrfPromise) {
    csrfPromise = fetch("/security/csrf-token", { credentials: "same-origin" })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => (d && d.csrf_token) || "")
      .catch(() => "");
  }
  const token = await csrfPromise;
  return token ? { "X-CSRF-Token": token } : {};
}

async function postJson(url, body) {
  for (let attempt = 0; attempt < 2; attempt += 1) {
    const headers = { "Content-Type": "application/json", ...(await mutationHeaders()) };
    const resp = await fetch(url, {
      method: "POST",
      headers,
      body: JSON.stringify(body),
      credentials: "same-origin",
    });
    if (attempt === 0 && resp.status === 403) {
      let csrfFailure = resp.headers.get("X-CSRF-Failure") === "token";
      if (!csrfFailure) {
        try {
          const data = await resp.clone().json();
          csrfFailure = Boolean(data && data.detail && data.detail.csrf_failure === "token");
        } catch (_) { /* 不是 JSON 就按普通 403 处理 */ }
      }
      if (csrfFailure) { csrfPromise = null; continue; }
    }
    return resp;
  }
  throw new Error("CSRF 校验反复失败");
}

async function callEntry(entry, args, timeoutMs = 120000) {
  const resp = await postJson("/runs", { plugin_id: PLUGIN_ID, entry_id: entry, args });
  if (!resp.ok) throw new Error(`启动失败 HTTP ${resp.status}`);
  const created = await resp.json();
  const runId = created.run_id;
  if (!runId) throw new Error("没有返回 run_id");

  const deadline = Date.now() + timeoutMs;
  let status = created.status || "queued";
  while (Date.now() < deadline) {
    await new Promise((r) => setTimeout(r, 320));
    const record = await fetch(`/runs/${runId}`, { credentials: "same-origin" })
      .then((r) => r.json())
      .catch(() => null);
    if (record && record.status) status = record.status;
    if (TERMINAL.includes(status)) break;
  }
  if (!TERMINAL.includes(status)) throw new Error("执行超时");

  const exported = await fetch(`/runs/${runId}/export`, { credentials: "same-origin" })
    .then((r) => r.json())
    .catch(() => ({}));
  const item = (exported.items || []).find((it) => it.label === "trigger_response");
  const body = (item && item.json) || {};
  if (body.success === false) {
    const err = body.error || {};
    throw new Error(err.message || "执行失败");
  }
  return body.data || {};
}

const $ = (id) => document.getElementById(id);
let toastTimer = null;
function toast(message, isError = false) {
  const el = $("toast");
  el.textContent = message;
  el.className = "show" + (isError ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ""; }, 3200);
}

function setState(text, kind) {
  const el = $("state");
  el.textContent = text;
  el.className = "badge" + (kind ? " " + kind : "");
}

let busy = false;
function setBusy(value) {
  busy = value;
  $("search").disabled = value;
  $("reset").disabled = value;
  $("upload").disabled = value || !$("file").files.length;
}

function render(items, query) {
  const grid = $("grid");
  grid.innerHTML = "";
  $("listTitle").textContent = query
    ? `搜索「${query}」· 最相近 ${items.length} 张`
    : `最近收录 · ${items.length} 张`;

  if (!items.length) {
    const empty = $("empty");
    empty.hidden = false;
    empty.textContent = query
      ? "没有匹配的图片。换个词试试，或者先收录一张。"
      : "还没有收录任何图片。选一个文件，或从插件入口收一张。";
    return;
  }
  $("empty").hidden = true;

  for (const item of items) {
    const tile = document.createElement("article");
    tile.className = "tile";

    const img = document.createElement("img");
    img.className = "shot";
    img.alt = item.caption || `#${item.id}`;
    if (item.thumb_data_url) img.src = item.thumb_data_url;
    tile.appendChild(img);

    const body = document.createElement("div");
    body.className = "body";

    const cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = item.caption || "（无描述）";
    body.appendChild(cap);

    const tags = document.createElement("div");
    tags.className = "tags";
    tags.textContent = (item.tags || []).join(" · ") || "—";
    body.appendChild(tags);

    const meta = document.createElement("div");
    meta.className = "meta";
    const score = item.score ? ` · ${Number(item.score).toFixed(3)}` : "";
    meta.textContent = `#${item.id} · ${item.lanlan || "未归属"} · ${item.engine || "?"}${score}`;
    body.appendChild(meta);

    const ops = document.createElement("div");
    ops.className = "ops";

    const send = document.createElement("button");
    send.className = "ghost";
    send.textContent = "发送";
    send.addEventListener("click", async () => {
      if (busy) return;
      setBusy(true);
      try {
        await callEntry("img_send", { image_id: item.id });
        toast(`已发送 #${item.id}`);
        loadLog();
      } catch (err) { toast(err.message, true); }
      finally { setBusy(false); }
    });

    const forget = document.createElement("button");
    forget.className = "ghost";
    forget.textContent = "遗忘";
    forget.addEventListener("click", async () => {
      if (busy) return;
      if (!confirm(`确认遗忘 #${item.id}？`)) return;
      setBusy(true);
      try {
        await callEntry("img_forget", { image_id: item.id });
        toast(`已遗忘 #${item.id}`);
        await refresh($("query").value.trim());
        loadLog();
      } catch (err) { toast(err.message, true); }
      finally { setBusy(false); }
    });

    ops.appendChild(send);
    ops.appendChild(forget);
    body.appendChild(ops);
    tile.appendChild(body);
    grid.appendChild(tile);
  }
}

async function refresh(query = "") {
  setBusy(true);
  setState("查询中", "busy");
  try {
    const data = await callEntry("img_board", {
      query,
      limit: 12,
      persona: $("personaSel").value || "",
    });
    render(data.items || [], query);
    setState("就绪", "ready");
  } catch (err) {
    setState("出错", "bad");
    toast(err.message, true);
  } finally {
    setBusy(false);
  }
}

async function loadStatus() {
  try {
    const data = await callEntry("img_status", {}, 30000);
    const counts = data.counts || {};
    const embedder = data.embedder || {};
    if (data.state === "ready") setState("就绪", "ready");
    else if (data.state === "initializing") setState("初始化中", "busy");
    else setState("降级", "bad");
    const dims = embedder.ready ? `${embedder.backend} · ${embedder.dim} 维` : (data.init_error || "编码器不可用");
    const judge = data.judge || {};
    $("judgeMode").value = judge.mode || "heuristic";
    $("judgeMeta").textContent = judge.mode === "heuristic"
      ? "当前：启发式"
      : `当前：${judge.mode} · ${(judge.active || []).join("/") || "未就绪"}`;
    $("stats").textContent = `共 ${counts.live ?? 0} 张 · ${dims}`;

    const sel = $("personaSel");
    const previous = sel.value;
    const archives = data.archives || [];
    sel.innerHTML = "";
    for (const item of archives) {
      const option = document.createElement("option");
      option.value = item.persona;
      option.textContent = `${item.persona}（${item.live}）`;
      sel.appendChild(option);
    }
    const wanted = previous || (data.persona && data.persona.name) || "";
    if (wanted && archives.some((a) => a.persona === wanted)) sel.value = wanted;
  } catch (err) {
    setState("离线", "bad");
    $("stats").textContent = err.message;
  }
}

async function loadLog() {
  const level = $("logLevel").value;
  try {
    const data = await callEntry("img_log", { limit: 30, level }, 30000);
    renderLog(data.items || []);
  } catch (err) {
    $("logMeta").textContent = err.message;
  }
}

function renderLog(items) {
  const list = $("logList");
  list.innerHTML = "";
  $("logMeta").textContent = items.length ? `最近 ${items.length} 条` : "暂无记录";
  for (const item of items) {
    const row = document.createElement("div");
    row.className = "logrow";

    const time = document.createElement("time");
    time.textContent = new Date((item.ts || 0) * 1000)
      .toLocaleTimeString("zh-CN", { hour12: false });

    const level = document.createElement("span");
    level.className = "lvl " + (item.level || "info");
    level.textContent = { info: "INFO", warn: "WARN", error: "ERR" }[item.level] || "INFO";

    const msg = document.createElement("span");
    msg.className = "logmsg";
    msg.textContent = `[${item.kind}] ${item.message}`;
    msg.title = msg.textContent;

    const meta = document.createElement("span");
    meta.className = "logmeta";
    meta.textContent = [
      item.engine,
      item.ms ? `${Math.round(item.ms)}ms` : "",
      item.image_id ? `#${item.image_id}` : "",
    ].filter(Boolean).join(" · ");

    row.append(time, level, msg, meta);
    list.appendChild(row);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result || "");
      resolve(text.includes(",") ? text.split(",", 2)[1] : text);
    };
    reader.onerror = () => reject(new Error("读取文件失败"));
    reader.readAsDataURL(file);
  });
}

$("file").addEventListener("change", () => {
  $("upload").disabled = busy || !$("file").files.length;
});

$("upload").addEventListener("click", async () => {
  const file = $("file").files[0];
  if (!file || busy) return;
  setBusy(true);
  setState("收录中", "busy");
  try {
    const b64 = await fileToBase64(file);
    const data = await callEntry("img_ingest", { source: "b64", b64 }, 180000);
    if (data.duplicate) toast(`这张已经收录过（#${data.id}）`);
    else if (data.accepted) toast(`已收录 #${data.id}：${data.verdict?.caption || data.code}`);
    else toast(`未收录：${data.code}${data.detail ? " · " + data.detail : ""}`, true);
    $("file").value = "";
    await refresh("");
    await loadStatus();
    await loadLog();
  } catch (err) {
    toast(err.message, true);
    setState("出错", "bad");
  } finally {
    setBusy(false);
  }
});

$("search").addEventListener("click", () => refresh($("query").value.trim()));
$("reset").addEventListener("click", () => { $("query").value = ""; refresh(""); });
$("query").addEventListener("keydown", (e) => {
  if (e.key === "Enter") refresh($("query").value.trim());
});

$("judgeSave").addEventListener("click", async () => {
  const mode = $("judgeMode").value;
  try {
    const data = await callEntry("img_set_judge", { mode }, 30000);
    toast(`判断层已切换为 ${data.mode}，稍后生效`);
    setTimeout(loadStatus, 1200);
  } catch (err) { toast(err.message, true); }
});

$("logRefresh").addEventListener("click", loadLog);
$("logLevel").addEventListener("change", loadLog);
$("personaSel").addEventListener("change", () => {
  refresh($("query").value.trim());
  loadLog();
});

loadStatus();
refresh("");
loadLog();
</script>
</body>
</html>
